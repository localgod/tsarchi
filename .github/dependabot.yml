version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      time: '00:00'
    open-pull-requests-limit: 10
    ignore:
      # vite-plus must match the `vite` alias to @voidzero-dev/vite-plus-core, which
      # Dependabot can't update. Upgrade both with `npm run upgrade:vite-plus`.
      - dependency-name: vite-plus
      - dependency-name: '@voidzero-dev/vite-plus-core'
    reviewers:
      - localgod
    assignees:
      - localgod
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
  - package-ecosystem: npm
    directory: '/slides'
    schedule:
      interval: weekly
      time: '00:00'
    open-pull-requests-limit: 10
    reviewers:
      - localgod
    assignees:
      - localgod
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      time: '00:00'
    open-pull-requests-limit: 10
    reviewers:
      - localgod
    assignees:
      - localgod
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope